services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: rag_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama pull nomic-embed-text
    restart: "no"

  api:
    build: .
    container_name: rag_health_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_HOST=http://ollama:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MEDICAL_TOPICS=cáncer de mama,cáncer de próstata,cáncer de pulmón,cáncer colorrectal,cáncer de cuello uterino,cáncer de estómago,cáncer de hígado,melanoma,leucemia,linfoma,presión arterial alta,ataque al corazón,insuficiencia cardíaca,accidente cerebrovascular,fibrilación auricular,enfermedad de las arterias coronarias,trombosis venosa profunda,embolia pulmonar,aterosclerosis,miocarditis,diabetes tipo 1,diabetes tipo 2,obesidad,colesterol alto,hipotiroidismo,hipertiroidismo,síndrome metabólico,gota,hígado graso,síndrome de ovario poliquístico,asma,enfermedad pulmonar obstructiva crónica,neumonía,tuberculosis,rinitis alérgica,sinusitis,bronquitis crónica,apnea del sueño,fibrosis pulmonar,covid-19,gripe,dengue,zika,chikungunya,fiebre amarilla,malaria,enfermedad de chagas,leishmaniasis,leptospirosis,vih sida,hepatitis b,hepatitis c,sífilis,virus del papiloma humano,herpes simple,meningitis,sepsis,lepra,sarampión,varicela,enfermedad de alzheimer,enfermedad de parkinson,epilepsia,migraña,esclerosis múltiple,esclerosis lateral amiotrófica,neuropatía diabética,depresión,trastorno de ansiedad,trastorno bipolar,esquizofrenia,trastorno del espectro autista,trastorno de déficit de atención e hiperactividad,trastorno obsesivo-compulsivo,trastorno de estrés postraumático,reflujo gastroesofágico,gastritis,úlcera péptica,enfermedad de crohn,colitis ulcerativa,síndrome del intestino irritable,cirrosis,pancreatitis,cálculos biliares,enfermedad celíaca,enfermedad renal crónica,cálculos renales,infecciones de las vías urinarias,hiperplasia prostática benigna,endometriosis,artritis reumatoide,osteoartritis,osteoporosis,lupus,fibromialgia,psoriasis,eczema,anemia,glaucoma,cataratas
      - DOCS_PER_TOPIC=3
    volumes:
      - ./storage_chroma:/app/storage_chroma
      - ./eval:/app/eval
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: rag_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: rag_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ollama_data:
  grafana_data: