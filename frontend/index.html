<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente de Saúde</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <h2>Assistente de Saúde Informativo</h2>
        </div>
        <div id="chat-window">
            <div class="message bot-message">
                Olá! Sou um assistente informativo. Faça perguntas sobre os documentos médicos. Lembre-se: esta informação não substitui um médico.
            </div>
        </div>
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Digite a sua pergunta..." autocomplete="off">
            <button type="submit" id="send-button">Enviar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
